<!DOCTYPE HTML>
<html>

<head>
    <!-- part where we linked css and js -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer> </script>
    <title>Url Shortener</title>
</head>

<body>
    <div id="shortUrl">
        <h1> Url Shortener</h1>

        <p> turn long links into short one!</p>
    </div>

    <div id="enterURL">
        <p> Enter your URL: </p>
        <form id="formUrl" novalidate>
            <input id="urlHere" type="url" placeholder="https://example.com"> <br> <br>
            <button type="submit" id="submittingTheUrl"> Shorten the URL! </button> <br> <br>

            <output id="takeTheShortenedUrl"></output>
            <button id="copyingTheUrl" type="button"> Copy! </button>
        </form>
    </div>

    <div id="statusMessage"></div>

    <form id="statsForm">
        <h1 id="statistics">View link statistics</h1>

        <p> Enter the code/shortened Url</p>

        <input id="statsRequest" type="text" placeholder="abc123 or http://localhost:3000/abc123">
        <br> <br>
        <button id="statsSearch" type="submit"> View statistics </button>

        <div id="viewStatsError"></div>
    </form>
</body>

</html>
