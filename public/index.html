<!DOCTYPE HTML>
<html>

<head>
    <!-- part where we linked css and js -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer> </script>
    <title>Url Shortener</title>
</head>

<body>

    <main class="container">

        <header id="shortUrl">
            <h1>Url Shortener</h1>
            <p>Turn long links into short ones!</p>
        </header>

        <section id="enterURL" class="card">

            <p>Enter your URL:</p>

            <form id="formUrl" novalidate>

                <input id="urlHere" type="url" placeholder="https://example.com">

                <button type="submit" id="submittingTheUrl">
                    Shorten the URL!
                </button>

                <output id="takeTheShortenedUrl"></output>

                <button id="copyingTheUrl" type="button">
                    Copy!
                </button>

            </form>

        </section>

        <div id="statusMessage"></div>

        <section class="card">

            <h2 id="statistics">View link statistics</h2>

            <form id="statsForm">

                <p>Enter the code/shortened URL</p>

                <input id="statsRequest" type="text" placeholder="abc123 or http://localhost:3000/abc123">

                <button id="statsSearch" type="submit">
                    View statistics
                </button>

                <div id="viewStatsError"></div>

            </form>

        </section>

    </main>

</body>

</html>
